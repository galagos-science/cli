[project]
name = "galagos-cli"
version = "0.1.0"
description = "Command-line client for the Galagos AI bioinformatics platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Galagos" }]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "platformdirs>=4.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
galagos = "galagos_cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length — handled by formatter, not the linter.
# B904: "raise ... from err" inside except — the CLI deliberately swallows
# the original exception in favour of a friendly user-facing message; the
# chained traceback would be noise to end users.
ignore = ["E501", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galagos_cli"]
